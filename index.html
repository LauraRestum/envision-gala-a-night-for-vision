<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Night for Vision</title>
<meta name="description" content="Watch the films and see the program from A Night for Vision, the Envision Gala, October 24, 2026.">
<meta property="og:title" content="A Night for Vision | Envision Gala 2026">
<meta property="og:description" content="Watch the films and see the program from the Envision Gala.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Allison&display=swap">
<style>
/* Gala look: black with the red glow, wide-spaced Montserrat, red points. Big text and buttons. */
:root { --bg: #0b0b0c; --red: #d6232b; --red-text: #ff5a61; --frame: rgba(255,255,255,0.22); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: #fff; font: 400 1.25rem/1.55 'Montserrat', Arial, sans-serif; }
.wrap { max-width: 40rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, p { margin: 0; }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* Top of the page, laid out like the gala's welcome slide and signs:
   Envision logo on top, script Welcome, bold wide title, light caps, thin red rule. */
.hero {
  text-align: center;
  background:
    linear-gradient(160deg, rgba(110,14,20,0.55), rgba(0,0,0,0) 55%),
    #000 url("assets/gala-glow.jpg") center / cover;
}
.hero .wrap { padding-block: calc(env(safe-area-inset-top, 0px) + 1.25rem) 2.25rem; }
.corners { display: flex; justify-content: center; align-items: flex-start; gap: 1rem; text-align: left; }
.corners .logo { width: 7.5rem; height: auto; display: block; margin-top: 0.35rem; }
.title { display: grid; justify-items: center; margin-top: 1.25rem; }
.welcome { font-family: 'Allison', 'Snell Roundhand', cursive; font-weight: 400; font-size: 6.25rem; line-height: 0.85; }
.to { font-size: 0.8rem; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; margin-top: 0.25rem; }
h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2; margin-top: 0.2rem; }
.gala { font-size: 1.05rem; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; margin-top: 0.15rem; }
.rule { width: 7rem; height: 1px; background: var(--red); margin: 1.1rem auto; }
.support { font-size: 0.85rem; font-weight: 300; letter-spacing: 0.24em; text-transform: uppercase; line-height: 1.7; }
.when { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 1rem; color: rgba(255,255,255,0.85); }
.band { background: linear-gradient(90deg, #7a0a10, var(--red) 50%, #7a0a10); text-align: center; }
.band .wrap { padding-block: 0.7rem; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.16em; white-space: nowrap; text-transform: uppercase; }
@media (max-width: 360px) { .welcome { font-size: 5.25rem; } h1 { font-size: 1.4rem; } }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 0.7rem; width: 100%; min-height: 68px;
  padding: 0.5rem 1.25rem; border: 0; border-radius: 2px; cursor: pointer; text-decoration: none;
  background: var(--red); color: #fff; font: 700 1rem 'Montserrat', Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
}
.btn svg { width: 1.4em; height: 1.4em; fill: currentColor; flex: none; }
.program-btn { padding-block: 1.75rem 0.5rem; }

main h2 { text-align: center; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; margin: 2.5rem 0 1.75rem; }
main h2::after { content: ""; display: block; width: 3rem; height: 3px; background: var(--red); margin: 0.7rem auto 0; }
.films { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; }
/* Each film is a compact row: small player on the left, title and length on the right. */
.film { display: grid; grid-template-columns: minmax(0, 11rem) 1fr; gap: 1rem; align-items: center; }
.film video { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--frame); display: block; }
.film h3 { margin: 0 0 0.3rem; font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
.film .len { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red-text); }
@media (max-width: 400px) { .film { grid-template-columns: 45% 1fr; gap: 0.85rem; } .film h3 { font-size: 1rem; } }

footer { margin-top: 3rem; }
footer .band .wrap { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.9rem); }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="corners">
      <img class="logo" src="assets/envision-logo-white.png" alt="Envision" width="647" height="144">
    </div>
    <div class="title">
      <p class="welcome" aria-hidden="true">Welcome</p>
      <p class="to" aria-hidden="true">to</p>
      <h1>A Night for Vision</h1>
      <p class="gala">Envision Gala</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="support">Your support helps make<br>our mission possible</p>
      <p class="when">October 24, 2026 &middot; Wichita Art Museum</p>
    </div>
  </div>
</header>
<div class="band" aria-hidden="true"><div class="wrap">Envision the Future &middot; Honor the Legacy</div></div>

<main class="wrap">
  <div class="program-btn">
    <a class="btn" href="program.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 3.5V8h4.5z"/></svg>View the program
    </a>
  </div>

  <h2>The films</h2>
  <ol class="films" id="films"></ol>
</main>

<footer><div class="band"><div class="wrap">Thank you for supporting our mission</div></div></footer>

<script>
/* The five films, in the order shown that night. Files are in videos/. */
var FILMS = [
  { title: "Participants Through the Ages", len: "4 min 42 sec", file: "legacy" },
  { title: "Envision Wichita Renovation Project - Phase I", len: "2 min 39 sec", file: "water-street" },
  { title: "Adah\u2019s Full Circle Journey at Envision Child Development Center", len: "2 min 41 sec", file: "full-circle" },
  { title: "A Summer at Heather\u2019s Camp", len: "1 min 40 sec", file: "heathers-camp" },
  { title: "Level Up: Ready for What\u2019s Next", len: "1 min 36 sec", file: "level-up" }
];

/* Pressing play opens the film full screen, turned sideways where the phone
   allows it. iPhones do this on their own; this covers Android and computers. */
function fullscreen(v) {
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  var req = v.requestFullscreen || v.webkitRequestFullscreen;
  if (req) {
    var r = req.call(v);
    if (r && r.then) r.then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    }).catch(function () {});
  } else if (v.webkitEnterFullscreen) {
    try { v.webkitEnterFullscreen(); } catch (e) {}
  }
}

var list = document.getElementById('films');
FILMS.forEach(function (f) {
  var li = document.createElement('li');
  li.className = 'film';
  var v = document.createElement('video');
  v.src = 'videos/' + f.file + '.mp4';
  v.poster = 'videos/' + f.file + '.jpg';
  v.controls = true;
  v.preload = 'none';
  v.setAttribute('aria-label', f.title);
  v.addEventListener('play', function () { fullscreen(v); });
  li.appendChild(v);
  var t = document.createElement('div');
  var h = document.createElement('h3'); h.textContent = f.title; t.appendChild(h);
  var p = document.createElement('p'); p.className = 'len'; p.textContent = f.len; t.appendChild(p);
  li.appendChild(t);
  list.appendChild(li);
});
</script>
</body>
</html>
